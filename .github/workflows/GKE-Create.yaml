name: Terraform GKE Cluster Management with GCS Backend

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose an action: apply or destroy"
        required: true
        default: "apply"
        type: choice
        options:
          - apply
          - destroy

env:
  TF_WORKING_DIR: ./terraform

jobs:
  terraform:
    name: Manage GKE Cluster
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_wrapper: false

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

    - name: Setup Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        export_default_credentials: true

    - name: Terraform Init
      run: terraform init -input=false
      working-directory: ${{ env.TF_WORKING_DIR }}
      
    - name: Disable deletion protection before destroy
      if: github.event.inputs.action == 'destroy'
      run: |
        terraform apply -auto-approve -var='deletion_protection=false'
      working-directory: ${{ env.TF_WORKING_DIR }}

    - name: Terraform Plan or Destroy
      run: |
        if [ "${{ github.event.inputs.action }}" == "apply" ]; then
          terraform plan -out=tfplan
        else
          terraform plan -destroy -out=tfplan
        fi
      working-directory: ${{ env.TF_WORKING_DIR }}

    - name: Apply or Destroy
      if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'
      run: terraform apply -auto-approve tfplan
      working-directory: ${{ env.TF_WORKING_DIR }}

    - name: Cleanup Terraform Plan
      if: github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy'
      run: rm -f tfplan
      working-directory: ${{ env.TF_WORKING_DIR }}









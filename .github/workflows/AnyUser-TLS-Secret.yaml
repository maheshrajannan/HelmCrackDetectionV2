name: Any User - Create mkcert TLS Secret

# ============================================================
# HOW TO USE THIS PIPELINE
# ============================================================
# This pipeline runs mkcert on the GitHub Actions runner to
# generate a locally-trusted TLS cert/key for the given domain,
# then creates (or updates) a Kubernetes TLS secret on the cluster.
#
# NOTE: mkcert certs are trusted only by the local machine's CA.
# They are suitable for internal/dev clusters but browsers will
# show a TLS warning unless the CA is distributed separately.
#
# Prerequisites:
#   - MAHESH_DIGITALOCEAN_ACCESS_TOKEN secret must be set in the repo
# ============================================================

on:
  workflow_dispatch:
    inputs:

      domain:
        description: "Domain to generate the mkcert certificate for (e.g. mahesh.concretecrackgallery.online)"
        required: true
        type: string

      secret_name:
        description: "Kubernetes TLS secret name"
        required: true
        default: "concrete-gallery-tls"
        type: string

      namespace:
        description: "Kubernetes namespace to create the secret in"
        required: true
        default: "default"
        type: string

      do_cluster_name:
        description: "DOKS cluster name"
        required: true
        default: "crack-detection-cluster"
        type: string

      do_token:
        description: "DigitalOcean API token"
        required: true
        type: string

jobs:
  create-mkcert-tls-secret:
    name: Create mkcert TLS Secret
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print input parameters
        run: |
          echo "================================================"
          echo "  Pipeline Input Parameters"
          echo "================================================"
          echo "  domain        : ${{ github.event.inputs.domain }}"
          echo "  secret_name   : ${{ github.event.inputs.secret_name }}"
          echo "  namespace     : ${{ github.event.inputs.namespace }}"
          echo "  do_cluster    : ${{ github.event.inputs.do_cluster_name }}"
          echo "  do_token      : ${{ github.event.inputs.do_token != '' && '*** provided ***' || 'NOT provided' }}"
          echo "================================================"

      - name: Install mkcert
        run: |
          curl -sLo mkcert https://github.com/FiloSottile/mkcert/releases/latest/download/mkcert-v1.4.4-linux-amd64
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/
          mkcert -version

      - name: Generate TLS cert with mkcert
        run: |
          mkcert -install
          mkcert "${{ github.event.inputs.domain }}"
          echo "Generated files:"
          ls -la *.pem

      - name: Install doctl
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/

      - name: Authenticate with DigitalOcean
        run: |
          doctl auth init -t ${{ github.event.inputs.do_token }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ github.event.inputs.do_cluster_name }}

      - name: Create TLS secret on cluster
        run: |
          DOMAIN="${{ github.event.inputs.domain }}"
          CERT_FILE="${DOMAIN}+0.pem"
          KEY_FILE="${DOMAIN}+0-key.pem"

          # mkcert names the files differently when there's only one domain
          if [[ ! -f "$CERT_FILE" ]]; then
            CERT_FILE="${DOMAIN}.pem"
            KEY_FILE="${DOMAIN}-key.pem"
          fi

          echo "Using cert: $CERT_FILE"
          echo "Using key : $KEY_FILE"

          kubectl create secret tls ${{ github.event.inputs.secret_name }} \
            --cert="$CERT_FILE" \
            --key="$KEY_FILE" \
            -n ${{ github.event.inputs.namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "TLS secret '${{ github.event.inputs.secret_name }}' created/updated in namespace '${{ github.event.inputs.namespace }}'."

      - name: Clean up cert files
        if: always()
        run: rm -f *.pem

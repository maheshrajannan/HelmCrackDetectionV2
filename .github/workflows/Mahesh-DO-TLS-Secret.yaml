name: Mahesh Create TLS Secret (DO)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'DO-SSL'
        type: choice
        options:
          - DO-SSL
      cert_content:
        description: 'Paste the contents of mahesh.concretecrackgallery.in.pem (certificate)'
        required: true
        type: string
      key_content:
        description: 'Paste the contents of mahesh.concretecrackgallery.in-key.pem (private key)'
        required: true
        type: string

jobs:
  create-tls-secret:
    name: Create TLS Secret on DOK Cluster
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Install doctl
      run: |
        curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
        sudo mv doctl /usr/local/bin/

    - name: Authenticate with DigitalOcean
      run: |
        doctl auth init -t ${{ secrets.MAHESH_DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Configure kubectl
      run: |
        doctl kubernetes cluster kubeconfig save crack-detection-cluster

    - name: Write cert and key to files
      run: |
        echo "${{ github.event.inputs.cert_content }}" > mahesh.concretecrackgallery.in.pem
        echo "${{ github.event.inputs.key_content }}" > mahesh.concretecrackgallery.in-key.pem

    - name: Create TLS Secret
      run: |
        kubectl create secret tls concrete-gallery-tls \
          --cert=mahesh.concretecrackgallery.in.pem \
          --key=mahesh.concretecrackgallery.in-key.pem \
          -n default \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Clean up cert files
      if: always()
      run: |
        rm -f mahesh.concretecrackgallery.in.pem mahesh.concretecrackgallery.in-key.pem

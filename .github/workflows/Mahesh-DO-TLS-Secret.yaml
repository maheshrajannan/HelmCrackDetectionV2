name: Mahesh Create TLS Secret (DO)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'DO-SSL'
        type: choice
        options:
          - DO-SSL
      cert_base64:
        description: 'Base64 encoded cert (run: base64 -w 0 concretecrackgallery.in.pem)'
        required: true
        type: string
      key_base64:
        description: 'Base64 encoded key (run: base64 -w 0 concretecrackgallery.in-key.pem)'
        required: true
        type: string

jobs:
  create-tls-secret:
    name: Create TLS Secret on DOK Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install doctl
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/

      - name: Authenticate with DigitalOcean
        run: |
          doctl auth init -t ${{ secrets.MAHESH_DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save crack-detection-cluster

      - name: Decode cert and key from base64
        run: |
          echo "${{ github.event.inputs.cert_base64 }}" | base64 -d > concretecrackgallery.in.pem
          echo "${{ github.event.inputs.key_base64 }}" | base64 -d > concretecrackgallery.in-key.pem

      - name: Create TLS Secret
        run: |
          kubectl create secret tls concrete-gallery-tls \
            --cert=concretecrackgallery.in.pem \
            --key=concretecrackgallery.in-key.pem \
            -n default \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Clean up cert files
        if: always()
        run: |
          rm -f concretecrackgallery.in.pem concretecrackgallery.in-key.pem

name: Any User - Install cert-manager + Let's Encrypt (DO)

# ============================================================
# HOW TO USE THIS PIPELINE
# ============================================================
# Run this ONCE after your DOKS cluster is up and the DNS A
# record is pointing to the NGINX ingress LoadBalancer IP.
#
# What this pipeline does:
#   1. Installs cert-manager via Helm in the cert-manager namespace
#   2. Creates a ClusterIssuer that talks to Let's Encrypt
#   3. cert-manager will then automatically issue + renew a real,
#      browser-trusted TLS cert for your domain
#
# Prerequisites:
#   - NGINX Ingress Controller already installed on the cluster
#   - DNS A record for your domain already pointing at the
#     NGINX LoadBalancer IP (run the deploy pipeline first)
#   - Port 80 must be open (Let's Encrypt HTTP-01 challenge)
#
# Recommended order:
#   1. Run with letsencrypt_env = staging  (test, no rate limits)
#   2. Confirm cert is issued successfully
#   3. Re-run with letsencrypt_env = production  (real trusted cert)
# ============================================================

on:
  workflow_dispatch:
    inputs:

      do_token:
        description: "DigitalOcean API token"
        required: true
        type: string

      do_cluster_name:
        description: "DOKS cluster name"
        required: true
        default: "crack-detection-cluster"
        type: string

      letsencrypt_email:
        description: "Email for Let's Encrypt notifications (cert expiry alerts)"
        required: true
        type: string

      letsencrypt_env:
        description: "staging = test certs (no browser trust), production = real trusted certs"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  install-cert-manager:
    name: Install cert-manager + ClusterIssuer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print input parameters
        run: |
          echo "================================================"
          echo "  Pipeline Input Parameters"
          echo "================================================"
          echo "  do_cluster_name   : ${{ github.event.inputs.do_cluster_name }}"
          echo "  do_token          : ${{ github.event.inputs.do_token != '' && '*** provided ***' || 'NOT provided' }}"
          echo "  letsencrypt_email : ${{ github.event.inputs.letsencrypt_email }}"
          echo "  letsencrypt_env   : ${{ github.event.inputs.letsencrypt_env }}"
          echo "================================================"

      - name: Install doctl
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/

      - name: Authenticate with DigitalOcean
        run: doctl auth init -t ${{ github.event.inputs.do_token }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ github.event.inputs.do_cluster_name }}

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Add Jetstack Helm repo
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Install cert-manager
        run: |
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --version v1.14.5 \
            --set installCRDs=true \
            --wait \
            --timeout 120s

      - name: Wait for cert-manager pods to be ready
        run: |
          kubectl rollout status deployment/cert-manager -n cert-manager --timeout=120s
          kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=120s
          kubectl rollout status deployment/cert-manager-cainjector -n cert-manager --timeout=120s
          echo "✅ cert-manager is ready"

      - name: Create Let's Encrypt ClusterIssuer
        run: |
          if [[ "${{ github.event.inputs.letsencrypt_env }}" == "production" ]]; then
            ACME_SERVER="https://acme-v02.api.letsencrypt.org/directory"
            echo "🔒 Using Let's Encrypt PRODUCTION"
          else
            ACME_SERVER="https://acme-staging-v02.api.letsencrypt.org/directory"
            echo "🧪 Using Let's Encrypt STAGING"
          fi

          kubectl apply -f - <<EOF
          apiVersion: cert-manager.io/v1
          kind: ClusterIssuer
          metadata:
            name: letsencrypt-${{ github.event.inputs.letsencrypt_env }}
          spec:
            acme:
              server: ${ACME_SERVER}
              email: ${{ github.event.inputs.letsencrypt_email }}
              privateKeySecretRef:
                name: letsencrypt-${{ github.event.inputs.letsencrypt_env }}-account-key
              solvers:
                - http01:
                    ingress:
                      class: nginx
          EOF

      - name: Verify ClusterIssuer is ready
        run: |
          for i in {1..12}; do
            READY=$(kubectl get clusterissuer letsencrypt-${{ github.event.inputs.letsencrypt_env }} \
              -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)
            if [[ "$READY" == "True" ]]; then
              echo "✅ ClusterIssuer letsencrypt-${{ github.event.inputs.letsencrypt_env }} is Ready"
              exit 0
            fi
            echo "⏳ Not ready yet, retrying in 10s... ($i/12)"
            sleep 10
          done
          echo "  ClusterIssuer not ready after 2 minutes — check logs:"
          echo "    kubectl logs -n cert-manager deploy/cert-manager"
          exit 1

      - name: Summary
        run: |
          echo "================================================"
          echo "  cert-manager install complete"
          echo "  ClusterIssuer: letsencrypt-${{ github.event.inputs.letsencrypt_env }}"
          echo ""
          echo "  cert-manager will now automatically issue and"
          echo "  renew the TLS cert for mahesh.concretecrackgallery.in"
          echo "  once the Ingress is deployed."
          echo "================================================"

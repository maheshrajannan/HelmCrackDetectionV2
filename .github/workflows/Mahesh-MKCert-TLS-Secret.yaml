name: Mahesh MKCert TLS Secret (DO)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'DO-SSL'
        type: choice
        options:
          - DO-SSL
          - master
      do_token:
        description: "[DO] DigitalOcean API token"
        required: true
        type: string
      cluster_name:
        description: "[DO] DOKS cluster name"
        required: true
        default: 'crack-detection-cluster'
        type: string
      domain_name:
        description: "Domain name for the certificate"
        required: true
        default: 'mahesh.concretecrackgallery.in'
        type: string

jobs:
  create-tls-secret:
    name: Create TLS Secret with MKCert on DOK Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Print input parameters
        run: |
          echo "================================================"
          echo "  Pipeline Input Parameters"
          echo "================================================"
          echo "  branch          : ${{ github.event.inputs.branch }}"
          echo "  cluster_name    : ${{ github.event.inputs.cluster_name }}"
          echo "  domain_name     : ${{ github.event.inputs.domain_name }}"
          echo "  do_token        : ${{ github.event.inputs.do_token != '' && '*** provided ***' || 'NOT provided' }}"
          echo "================================================"

      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          curl -sL https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64 -o mkcert
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/
          mkcert -install

      - name: Install doctl
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/

      - name: Authenticate with DigitalOcean
        run: |
          doctl auth init -t ${{ github.event.inputs.do_token }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ github.event.inputs.cluster_name }}

      - name: Generate Certificate with MKCert
        run: |
          mkcert ${{ github.event.inputs.domain_name }}

      - name: Create TLS Secret
        run: |
          kubectl create secret tls concrete-gallery-tls \
            --cert=${{ github.event.inputs.domain_name }}.pem \
            --key=${{ github.event.inputs.domain_name }}-key.pem \
            -n default \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upload Root CA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootCA
          path: /home/runner/.local/share/mkcert/rootCA.pem

      - name: Clean up cert files
        if: always()
        run: |
          rm -f ${{ github.event.inputs.domain_name }}.pem ${{ github.event.inputs.domain_name }}-key.pem

name: Mahesh MKCert TLS Secret (DO)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout'
        required: true
        default: 'DO-SSL'
        type: choice
        options:
          - DO-SSL

jobs:
  create-tls-secret:
    name: Create TLS Secret with MKCert on DOK Cluster
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install mkcert
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
          curl -sL https://github.com/FiloSottile/mkcert/releases/download/v1.4.4/mkcert-v1.4.4-linux-amd64 -o mkcert
          chmod +x mkcert
          sudo mv mkcert /usr/local/bin/
          mkcert -install

      - name: Install doctl
        run: |
          curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
          sudo mv doctl /usr/local/bin/

      - name: Authenticate with DigitalOcean
        run: |
          doctl auth init -t ${{ secrets.MAHESH_DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save crack-detection-cluster

      - name: Generate Certificate with MKCert
        run: |
          mkcert mahesh.concretecrackgallery.in
          # mkcert output files are usually named:
          # mahesh.concretecrackgallery.in.pem
          # mahesh.concretecrackgallery.in-key.pem

      - name: Create TLS Secret
        run: |
          kubectl create secret tls concrete-gallery-tls \
            --cert=mahesh.concretecrackgallery.in.pem \
            --key=mahesh.concretecrackgallery.in-key.pem \
            -n default \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Upload Root CA as artifact
        uses: actions/upload-artifact@v3
        with:
          name: rootCA
          path: /home/runner/.local/share/mkcert/rootCA.pem

      - name: Clean up cert files
        if: always()
        run: |
          rm -f mahesh.concretecrackgallery.in.pem mahesh.concretecrackgallery.in-key.pem

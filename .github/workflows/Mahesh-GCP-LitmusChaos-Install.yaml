name: Mahesh GCP LitmusChaos Install 

on:
  workflow_dispatch:
    inputs:
      gcp_sa_key_base64:
        description: "GCP SA key base64 single-line. Linux: base64 -w 0 key.json | Mac: base64 -i key.json | tr -d '\\n'"
        required: true
        type: string

jobs:
  install-litmus-chaos:
    name: Install LitmusChaos on GKE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          version: 'latest'

      - name: Authenticate to Google Cloud
        env:
          GCP_SA_KEY_BASE64: ${{ github.event.inputs.gcp_sa_key_base64 }}
        run: |
          echo "$GCP_SA_KEY_BASE64" | tr -d '\n' | base64 -d > $HOME/gcp-key.json
          gcloud auth activate-service-account --key-file=$HOME/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ secrets.MAHESH_GKE_CLUSTER_NAME }} \
            --zone ${{ secrets.MAHESH_GKE_CLUSTER_ZONE }} \
            --project ${{ secrets.MAHESH_GCP_PROJECT_ID }}
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Create litmus namespace
        run: |
          kubectl create ns litmus || true

      - name: Add LitmusChaos Helm repo
        run: |
          helm repo add litmuschaos https://litmuschaos.github.io/litmus-helm/ || true
          helm repo update

      - name: Install LitmusChaos via Helm
        run: |
          helm upgrade --install litmus litmuschaos/litmus -n litmus \
            --set portal.server.resources.requests.cpu=100m \
            --set portal.server.resources.requests.memory=256Mi \
            --set portal.frontend.service.type=LoadBalancer \
            --set portal.server.service.type=LoadBalancer

      - name: Apply LitmusChaos Portal CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/litmuschaos/litmus/master/mkdocs/docs/3.21.0/litmus-portal-crds.yml

      - name: Get LitmusChaos Portal URL
        run: |
          echo "======================================================"
          echo "  Waiting for LitmusChaos frontend LoadBalancer IP..."
          echo "======================================================"
          for i in {1..20}; do
            LITMUS_IP=$(kubectl get svc litmus-frontend-service -n litmus -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            if [[ -n "$LITMUS_IP" ]]; then
              echo "LitmusChaos Portal: http://$LITMUS_IP:9091"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 15
          done
          if [[ -z "$LITMUS_IP" ]]; then
            echo "LoadBalancer IP not yet assigned. Check manually: kubectl get svc -n litmus"
          fi
          echo "======================================================"

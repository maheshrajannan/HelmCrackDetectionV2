name: Mahesh DOK-deploy crack detection 

# Triggered manually from the GitHub Actions tab
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'DO-SSL'
        type: choice
        options:
          - DO-SSL
      do_token:
        description: "[DO] DigitalOcean API token"
        required: true
        type: string
      cluster_name:
        description: "[DO] DOKS cluster name"
        required: true
        type: string

jobs:
  DOK-deploy-concrete-detection:
    name: Mahesh DOK-deploy-concrete-detection
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch }}

    - name: Print input parameters
      run: |
        echo "================================================"
        echo "  Pipeline Input Parameters"
        echo "================================================"
        echo "  branch          : ${{ github.event.inputs.branch }}"
        echo "  cluster_name    : ${{ github.event.inputs.cluster_name }}"
        echo "  do_token        : ${{ github.event.inputs.do_token != '' && '*** provided ***' || 'NOT provided' }}"
        echo "================================================"

    - name: Log in to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.MAHESH_DOCKER_USERNAME }}
        password: ${{ secrets.MAHESH_DOCKER_PASSWORD }}

    - name: Pull Image Upload Logic
      run: |
        docker pull ${{ secrets.MAHESH_DOCKER_USERNAME }}/image-upload-logic:latest

    - name: Pull Crack Detection Logic
      run: |
        docker pull ${{ secrets.MAHESH_DOCKER_USERNAME }}/crack-detection-logic:latest

    - name: Pull Concrete Image Gallery Logic
      run: |
        docker pull ${{ secrets.MAHESH_DOCKER_USERNAME }}/concrete-image-gallery-logic:latest

    # Set up doctl (DigitalOcean CLI)
    - name: Install doctl
      run: |
        curl -sL https://github.com/digitalocean/doctl/releases/download/v1.97.0/doctl-1.97.0-linux-amd64.tar.gz | tar -xz
        sudo mv doctl /usr/local/bin/

    - name: Authenticate with DigitalOcean
      run: |
        doctl auth init -t ${{ github.event.inputs.do_token }}

    # Configure kubectl to connect to the DOKS cluster
    - name: Configure kubectl
      run: |
        doctl kubernetes cluster kubeconfig save ${{ github.event.inputs.cluster_name }}

    # Install Helm directly
    - name: Install Helm
      run: |
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

    # Install NGINX Ingress Controller if on DO-SSL branch
    - name: Install NGINX Ingress Controller
      if: github.event.inputs.branch == 'DO-SSL'
      run: |
        helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
        helm repo update
        helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
          --set controller.publishService.enabled=true \
          --set controller.minReadySeconds=5 \
          --set controller.progressDeadlineSeconds=600 \
          --set controller.service.type=LoadBalancer \
          --set controller.service.externalTrafficPolicy=Local \
          --set defaultBackend.enabled=true \
          --set controller.admissionWebhooks.enabled=true \
          --set controller.admissionWebhooks.patch.enabled=true \
          --set controller.admissionWebhooks.certManager.enabled=false \
          --set controller.admissionWebhooks.failurePolicy=Fail \
          --timeout 120s \
          --wait
    
    # ✅ Wait for NGINX Ingress Controller to be Ready
    - name: Wait for NGINX Admission Webhook to be Ready
      if: github.event.inputs.branch == 'DO-SSL'
      run: |
        kubectl rollout status deployment ingress-nginx-controller --timeout=120s
        kubectl wait --for=condition=available deployment/ingress-nginx-controller \
          --timeout=120s
    
    # ✅ Wait for LoadBalancer IP to be provisioned
    - name: Wait for NGINX LoadBalancer IP
      if: github.event.inputs.branch == 'DO-SSL'
      run: |
        for i in {1..60}; do
          IP=$(kubectl get svc ingress-nginx-controller -o jsonpath="{.status.loadBalancer.ingress[0].ip}")
          if [[ -n "$IP" ]]; then
            echo "✅ LoadBalancer IP acquired: $IP"
            break
          fi
          echo "⏳ Waiting for LoadBalancer IP..."
          sleep 10
        done

    
    # # Install cert-manager if on DO-SSL branch
    # - name: Install cert-manager
    #   if: github.event.inputs.branch == 'DO-SSL'
    #   run: |
    #     helm repo add jetstack https://charts.jetstack.io
    #     helm repo update
    #     helm install cert-manager jetstack/cert-manager \
    #       --namespace cert-manager \
    #       --create-namespace \
    #       --version v1.12.0 \
    #       --set installCRDs=true

    - name: Deploy Application using Helm
      run: |
        helm upgrade --install nfs-server ./nfsServerChart
        sleep 3
        python3 populateCIP.py
        sleep 3
        helm upgrade --install master-chart ./masterChart
        sleep 5
        
    - name: Retrieve Ingress LoadBalancer IP
      id: ingress-ip
      run: |
        # Wait for the LoadBalancer IP to be assigned (with timeout)
        for i in {1..30}; do
          IP=$(kubectl get svc ingress-nginx-controller -n default -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [[ -n "$IP" ]]; then
            echo "Retrieved Ingress IP: $IP"
            echo "::set-output name=ingressIp::$IP"
            exit 0
          fi
          echo "Waiting for Ingress IP to be assigned... (attempt $i/30)"
          sleep 5
        done
        echo "::error::Failed to retrieve Ingress IP after 30 attempts"
        exit 1

    - name: Update DNS Records with Ingress IP
      if: github.event.inputs.branch == 'DO-SSL'
      env:
        DIGITALOCEAN_TOKEN: ${{ secrets.MAHESH_DIGITALOCEAN_ACCESS_TOKEN }}
        DOMAIN: "mahesh.concretecrackgallery.in"
        TTL: 300
      run: |
        NEW_IP="${{ steps.ingress-ip.outputs.ingressIp }}"
        if [[ -z "$NEW_IP" ]]; then
          echo "❌ Error: Ingress IP address is empty!"
          exit 1
        fi
        
        echo "🔍 Fetching existing A record for $DOMAIN..."
        RECORD_INFO=$(doctl compute domain records list "$DOMAIN" --format ID,Type,Name,Data --no-header | awk '$2=="A" && $3=="@" {print $1, $4}')
        
        if [[ -n "$RECORD_INFO" ]]; then
          RECORD_ID=$(echo "$RECORD_INFO" | awk '{print $1}')
          CURRENT_IP=$(echo "$RECORD_INFO" | awk '{print $2}')
          
          if [[ "$CURRENT_IP" == "$NEW_IP" ]]; then
            echo "✅ The existing A record already points to $NEW_IP. No update needed."
          else
            echo "🔄 Updating existing A record (ID: $RECORD_ID) for $DOMAIN..."
            doctl compute domain records update "$DOMAIN" --record-id "$RECORD_ID" --record-data "$NEW_IP"
            echo "✅ A record updated!"
          fi
        else
          echo "📌 No existing A record found. Creating a new one..."
          doctl compute domain records create "$DOMAIN" \
            --record-type A \
            --record-name "@" \
            --record-data "$NEW_IP" \
            --record-ttl "$TTL"
          echo "✅ A record created!"
        fi
    

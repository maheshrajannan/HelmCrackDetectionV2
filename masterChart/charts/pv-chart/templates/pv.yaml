apiVersion: v1
kind: PersistentVolume
metadata:
  name: concrete-images-pv-nfs
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: {{ required "pv-chart.nfsCIP must be set at deploy time (discover from: kubectl get svc nfs-server-svc-cip -o jsonpath='{.spec.clusterIP}')" .Values.nfsCIP }}
    path: "/"
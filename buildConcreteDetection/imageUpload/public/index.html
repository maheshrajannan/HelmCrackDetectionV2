<!DOCTYPE html>
<html lang="en">
<head>
    <title>Crack Detection | Upload</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1), transparent),
                              radial-gradient(circle at bottom left, rgba(79, 70, 229, 0.05), transparent);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .upload-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h1 {
            font-weight: 600;
            font-size: 1.875rem;
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 40px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            background: rgba(0, 0, 0, 0.1);
        }

        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .drop-zone i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .drop-zone p {
            font-size: 1rem;
            color: var(--text-main);
            margin: 0;
        }

        .drop-zone span {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        #file-input {
            display: none;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
            margin-top: 24px;
            max-height: 200px;
            overflow-y: auto;
            padding: 4px;
        }

        .preview-item {
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .upload-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            margin-top: 32px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .upload-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .upload-btn:active {
            transform: translateY(0);
        }

        .upload-btn:disabled {
            background: #4b5563;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            margin-top: 24px;
            display: none;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .status-msg {
            margin-top: 16px;
            font-size: 0.875rem;
            border-radius: 8px;
            padding: 10px;
            display: none;
        }

        .status-success {
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .footer-links {
            margin-top: 32px;
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .footer-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="upload-card">
        <h1>Upload Images</h1>
        <p class="subtitle">Upload concrete images for crack detection</p>
        
        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Drag & Drop images here</p>
            <span>or click to browse files</span>
            <input type="file" id="file-input" name="photos" accept="image/*" multiple>
        </div>

        <div class="preview-container" id="preview-container"></div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <p id="progress-text" style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px;">0%</p>
        </div>

        <button class="upload-btn" id="upload-btn" disabled>
            <i class="fas fa-arrow-up"></i>
            Upload Files
        </button>

        <div class="status-msg" id="status-msg"></div>

        <div class="footer-links">
            <a href="http://localhost:8082"><i class="fas fa-images"></i> View Gallery</a>
        </div>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('preview-container');
    const uploadBtn = document.getElementById('upload-btn');
    const progressBar = document.getElementById('progress-bar-fill');
    const progressContainer = document.getElementById('progress-container');
    const progressText = document.getElementById('progress-text');
    const statusMsg = document.getElementById('status-msg');

    let selectedFiles = [];

    // Drag and drop handlers
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
    });

    dropZone.addEventListener('drop', handleDrop, false);

    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
    }

    fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
    });

    function handleFiles(files) {
        selectedFiles = [...files].filter(file => file.type.startsWith('image/'));
        renderPreviews();
        uploadBtn.disabled = selectedFiles.length === 0;
        statusMsg.style.display = 'none';
        progressBar.style.width = '0%';
        progressContainer.style.display = 'none';
    }

    function renderPreviews() {
        previewContainer.innerHTML = '';
        selectedFiles.forEach(file => {
            const reader = new FileReader();
            const div = document.createElement('div');
            div.className = 'preview-item';
            const img = document.createElement('img');
            
            reader.onload = (e) => {
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            
            div.appendChild(img);
            previewContainer.appendChild(div);
        });
    }

    uploadBtn.addEventListener('click', () => {
        if (selectedFiles.length === 0) return;

        const formData = new FormData();
        selectedFiles.forEach(file => {
            formData.append('photos', file);
        });

        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/uploaded', true);

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const percentComplete = Math.round((e.loaded / e.total) * 100);
                uploadBtn.disabled = true;
                progressContainer.style.display = 'block';
                progressBar.style.width = percentComplete + '%';
                progressText.innerText = percentComplete + '%';
            }
        };

        xhr.onload = () => {
            if (xhr.status === 200) {
                showStatus('Successfully uploaded ' + selectedFiles.length + ' images!', 'success');
                selectedFiles = [];
                renderPreviews();
                uploadBtn.disabled = true;
                fileInput.value = '';
            } else {
                showStatus('Upload failed. Please try again.', 'error');
                uploadBtn.disabled = false;
            }
            progressContainer.style.display = 'none';
        };

        xhr.onerror = () => {
            showStatus('An error occurred during the upload.', 'error');
            uploadBtn.disabled = false;
            progressContainer.style.display = 'none';
        };

        xhr.send(formData);
    });

    function showStatus(msg, type) {
        statusMsg.innerText = msg;
        statusMsg.className = 'status-msg status-' + type;
        statusMsg.style.display = 'block';
    }
</script>
</body>
</html>
